name: Auto Sync Forks & Disable Actions

on:
  schedule:
    # =========================================================================
    # ⏰【定时修改指南】在此处修改执行频率：
    # 格式: 分(0-59) 时(0-23 UTC) 日(1-31) 月(1-12) 星期(0-6, 0为周日)
    #
    # 常用示例 (UTC 时间 +8 为北京时间):
    # - '23 3 * * 0'     # 每周日 03:23 UTC（北京时间每周日 11:23）【当前默认】
    # - '23 3 * * 1,5'   # 每周一和周五各运行一次
    # - '23 3 */3 * *'   # 每 3 天运行一次
    # - '23 3 * * *'     # 每天运行一次（北京时间 11:23）
    # - '23 */6 * * *'   # 每 6 小时运行一次
    # - '23 3 1 * *'     # 每月 1 号运行一次
    # =========================================================================
    - cron: '23 3 * * 0'
  # Triggers immediately when you star the repository (Click Star / Unstar+Star to run)
  watch:
    types: [started]
  workflow_dispatch:
    inputs:
      include_only:
        description: 'Only sync specified repos (e.g. repo1,owner/repo2). Leave empty to sync all.'
        type: string
        required: false
        default: ''
      exclude_repos:
        description: 'Exclude specific repos (e.g. repo3,owner/repo4). Leave empty to sync all.'
        type: string
        required: false
        default: ''
      debug_mode:
        description: 'Enable debug mode (display detailed repo names in public summary)'
        type: boolean
        default: false
      disable_actions:
        description: 'Disable GitHub Actions on all forked repos'
        type: boolean
        default: true
      dry_run:
        description: 'Dry run mode (logging only, do not modify)'
        type: boolean
        default: false

concurrency:
  group: sync-forks-lock
  cancel-in-progress: false

jobs:
  sync-forks:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # If triggered by Star (watch), only execute if the star is by the repo owner
    if: github.event_name != 'watch' || github.actor == github.repository_owner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fork Synchronizer
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          EXCLUDE_REPOS: ${{ inputs.exclude_repos != '' && inputs.exclude_repos || vars.EXCLUDE_REPOS || secrets.EXCLUDE_REPOS }}
          INCLUDE_ONLY: ${{ inputs.include_only != '' && inputs.include_only || vars.INCLUDE_ONLY || secrets.INCLUDE_ONLY }}
          DEBUG_MODE: ${{ inputs.debug_mode != '' && inputs.debug_mode || secrets.DEBUG_MODE || vars.DEBUG_MODE || 'false' }}
          DISABLE_ACTIONS: ${{ inputs.disable_actions != '' && inputs.disable_actions || secrets.DISABLE_ACTIONS || vars.DISABLE_ACTIONS || 'true' }}
          DRY_RUN: ${{ inputs.dry_run != '' && inputs.dry_run || secrets.DRY_RUN || vars.DRY_RUN || 'false' }}
        run: |
          python -m src.main
