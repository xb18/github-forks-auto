name: Auto Sync Forks & Disable Actions

on:
  schedule:
    # Runs once a week on Sunday at 03:23 UTC (11:23 Beijing Time, avoiding top-of-hour congestion for near-zero queue latency)
    - cron: '23 3 * * 0'
  # Triggers immediately when you star the repository (Click Star / Unstar+Star to run)
  watch:
    types: [started]
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable debug mode (display detailed repo names in public summary)'
        type: boolean
        default: false
      disable_actions:
        description: 'Disable GitHub Actions on all forked repos'
        type: boolean
        default: true
      dry_run:
        description: 'Dry run mode (logging only, do not modify)'
        type: boolean
        default: false

concurrency:
  group: sync-forks-lock
  cancel-in-progress: false

jobs:
  sync-forks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # If triggered by Star (watch), only execute if the star is by the repo owner
    if: github.event_name != 'watch' || github.actor == github.repository_owner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fork Synchronizer
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          EXCLUDE_REPOS: ${{ vars.EXCLUDE_REPOS || secrets.EXCLUDE_REPOS }}
          INCLUDE_ONLY: ${{ vars.INCLUDE_ONLY || secrets.INCLUDE_ONLY }}
          DEBUG_MODE: ${{ inputs.debug_mode != '' && inputs.debug_mode || secrets.DEBUG_MODE || vars.DEBUG_MODE || 'false' }}
          DISABLE_ACTIONS: ${{ inputs.disable_actions != '' && inputs.disable_actions || 'true' }}
          DRY_RUN: ${{ inputs.dry_run != '' && inputs.dry_run || 'false' }}
        run: |
          python -m src.main
