name: Auto Sync Forks & Disable Actions

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      disable_actions:
        description: 'Disable GitHub Actions on all forked repos'
        type: boolean
        default: true
      dry_run:
        description: 'Dry run mode (logging only, do not modify)'
        type: boolean
        default: false

concurrency:
  group: sync-forks-lock
  cancel-in-progress: false

jobs:
  sync-forks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fork Synchronizer
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          EXCLUDE_REPOS: ${{ vars.EXCLUDE_REPOS }}
          INCLUDE_ONLY: ${{ vars.INCLUDE_ONLY }}
          DISABLE_ACTIONS: ${{ inputs.disable_actions != '' && inputs.disable_actions || 'true' }}
          DRY_RUN: ${{ inputs.dry_run != '' && inputs.dry_run || 'false' }}
        run: |
          python -m src.main
